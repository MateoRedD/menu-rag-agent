[pytest]
pythonpath = .
testpaths = tests
markers =
    integration: calls the real OpenAI API and reads Supabase (costs money). Run with: pytest -m integration
# Plain "pytest" runs only the free, offline unit tests. A later -m on the command line overrides this one.
addopts = -m "not integration"
# supabase 2.33 passes these deprecated arguments to postgrest internally; our code doesn't use them.
filterwarnings =
    ignore:The 'timeout' parameter is deprecated:DeprecationWarning
    ignore:The 'verify' parameter is deprecated:DeprecationWarning
